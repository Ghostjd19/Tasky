<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Track your clients' tasks, deadlines and what's already done.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tasky">
  <title>Tasky</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <div class="strip" id="sampleStrip" hidden>
      <span>You're looking at sample data.</span>
      <button type="button" class="link" data-action="start-fresh">Start fresh</button>
      <button type="button" class="strip-close" data-action="keep-sample" aria-label="Keep sample data and dismiss">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
      </button>
    </div>

    <main>
      <!-- Tasks -->
      <section class="view" id="view-tasks" aria-labelledby="tasksTitle">
        <header class="page-head">
          <div>
            <p class="eyebrow" id="todayLabel"></p>
            <h1 class="page-title" id="tasksTitle">Tasks</h1>
          </div>
        </header>

        <div class="chips" id="clientChips" aria-label="Filter by client"></div>
        <div class="tiles" id="tiles"></div>

        <div class="segmented" id="segmented" role="tablist" aria-label="Task status">
          <button type="button" role="tab" data-action="seg" data-seg="todo" aria-selected="true" aria-controls="taskList">
            To do <span class="count" id="countTodo"></span>
          </button>
          <button type="button" role="tab" data-action="seg" data-seg="done" aria-selected="false" aria-controls="taskList">
            Done <span class="count" id="countDone"></span>
          </button>
        </div>

        <div id="taskList" role="tabpanel"></div>
      </section>

      <!-- Clients -->
      <section class="view" id="view-clients" aria-labelledby="clientsTitle" hidden>
        <header class="page-head">
          <div>
            <p class="eyebrow" id="clientsSummary"></p>
            <h1 class="page-title" id="clientsTitle">Clients</h1>
          </div>
          <button type="button" class="pill-outline" data-action="new-client">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            Add client
          </button>
        </header>

        <div class="client-list" id="clientList"></div>

        <section class="data-card" aria-labelledby="dataTitle">
          <h2 class="group-title" id="dataTitle">Your data</h2>
          <p class="muted">Everything is saved on this device. Export a backup to move it to another phone.</p>
          <div class="data-actions">
            <button type="button" class="link" data-action="export">Export backup</button>
            <button type="button" class="link" data-action="import">Import backup</button>
            <button type="button" class="link link-danger" data-action="reset">Erase everything</button>
          </div>
          <input type="file" id="importFile" accept="application/json,.json" hidden>
        </section>
      </section>
    </main>
  </div>

  <!-- Bottom dock -->
  <div class="dock">
    <div class="dock-inner">
      <nav class="tabbar" aria-label="Main">
        <button type="button" class="tab" data-action="tab" data-view="tasks" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5l1.6 1.6L8.8 5"/><path d="M4 12.5l1.6 1.6 3.2-3.1"/><circle cx="6.2" cy="18.3" r="1.9"/><path d="M12.5 7h7.5M12.5 13h7.5M12.5 18.5h7.5"/></svg>
          <span>Tasks</span>
        </button>
        <button type="button" class="tab" data-action="tab" data-view="clients" aria-current="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.2" r="3.2"/><path d="M3.5 19.2c.6-3.2 2.9-5.1 5.5-5.1s4.9 1.9 5.5 5.1"/><circle cx="17" cy="9" r="2.5"/><path d="M15.8 14.3c2.4-.3 4.3 1.3 4.8 4.4"/></svg>
          <span>Clients</span>
        </button>
      </nav>
      <button type="button" class="fab" data-action="new-task" aria-label="New task">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Task sheet -->
  <dialog class="sheet" id="taskSheet" aria-labelledby="taskSheetTitle">
    <form class="sheet-form" id="taskForm" novalidate>
      <div class="handle" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 id="taskSheetTitle">New task</h2>
        <button type="button" class="icon-btn" data-action="close-sheet" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
      </div>

      <label class="field">
        <span class="field-label">What needs doing?</span>
        <input class="input" id="taskTitle" placeholder="e.g. Send homepage mockup" maxlength="160" autocomplete="off" enterkeyhint="done">
        <span class="field-error" id="taskTitleError" hidden>Give the task a name.</span>
      </label>

      <div class="field">
        <span class="field-label">Client</span>
        <div class="chips chips-wrap" id="taskClientChips"></div>
        <div class="inline-new" id="newClientRow" hidden>
          <input class="input" id="newClientName" placeholder="New client name" maxlength="60" autocomplete="off" aria-label="New client name">
          <button type="button" class="pill-outline" data-action="add-inline-client">Add</button>
        </div>
      </div>

      <div class="field">
        <span class="field-label">Deadline</span>
        <div class="chips chips-wrap" id="dueChips">
          <button type="button" class="chip" data-action="sheet-due" data-due="0" aria-pressed="false">Today</button>
          <button type="button" class="chip" data-action="sheet-due" data-due="1" aria-pressed="false">Tomorrow</button>
          <button type="button" class="chip" data-action="sheet-due" data-due="7" aria-pressed="false">In a week</button>
          <label class="chip chip-date" id="pickDateChip">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
            <span id="pickDateLabel">Pick date</span>
            <input type="date" id="taskDue" aria-label="Pick a deadline date">
          </label>
          <button type="button" class="chip" data-action="sheet-due" data-due="none" aria-pressed="false">No date</button>
        </div>
      </div>

      <label class="field">
        <span class="field-label">Notes <span class="optional">optional</span></span>
        <textarea class="input" id="taskNotes" rows="2" placeholder="Links, feedback, details…"></textarea>
      </label>

      <button type="submit" class="btn-primary" id="taskSubmit">Add task</button>

      <div class="sheet-secondary" id="taskEditActions" hidden>
        <button type="button" class="link" data-action="toggle-from-sheet" id="toggleFromSheet">Mark as done</button>
        <button type="button" class="link link-danger" data-action="delete-task">Delete task</button>
      </div>
    </form>
  </dialog>

  <!-- Client sheet -->
  <dialog class="sheet" id="clientSheet" aria-labelledby="clientSheetTitle">
    <form class="sheet-form" id="clientForm" novalidate>
      <div class="handle" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 id="clientSheetTitle">New client</h2>
        <button type="button" class="icon-btn" data-action="close-sheet" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
      </div>

      <label class="field">
        <span class="field-label">Name</span>
        <input class="input" id="clientName" placeholder="e.g. Nova Studio" maxlength="60" autocomplete="off" enterkeyhint="done">
        <span class="field-error" id="clientNameError" hidden>Give the client a name.</span>
      </label>

      <div class="field">
        <span class="field-label" id="colorLabel">Color</span>
        <div class="swatches" id="swatches" role="radiogroup" aria-labelledby="colorLabel"></div>
      </div>

      <button type="submit" class="btn-primary" id="clientSubmit">Add client</button>

      <div class="sheet-secondary" id="clientEditActions" hidden>
        <button type="button" class="link link-danger" data-action="delete-client">Delete client</button>
      </div>
    </form>
  </dialog>

  <noscript><p class="noscript">Tasky needs JavaScript to run.</p></noscript>
  <script src="app.js"></script>
</body>
</html>
